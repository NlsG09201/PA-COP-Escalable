# Builds: se recomienda BuildKit (Docker Desktop lo trae activo). Cache de Maven/npm/pip acelera rebuilds.
# Si subes imágenes a un registry, construye solo lo cambiado: docker compose build legacy-backend dashboard
#
# Perfil `ai`: incluye ai-diagnosis-service, emotion-analysis-service, recommendation-engine, image-to-3d-depth, etc.
# Sin `docker compose --profile ai up -d` esos contenedores no arrancan; el front puede seguir llamando rutas api-compat con stubs.
# Entrenamiento local: ver scripts/ai-train-docker.ps1 (dataset requerido).
services:
  mongodb-keyfile:
    image: alpine:3.20
    profiles: ["core","legacy","nest","ai"]
    security_opt:
      - no-new-privileges:true
    environment:
      # Dev default. Override by editing this value (or add an .env and replace it here).
      # Must be base64-like (avoid '_' and other unsupported chars).
      MONGO_REPLICA_SET_KEY: cG9wZGV2cmVwbGljYXNldGtleQ==
    volumes:
      - mongodb_keyfile:/keyfile
    command:
      - sh
      - -lc
      - |
        umask 077
        if [ -z "$$MONGO_REPLICA_SET_KEY" ]; then echo "MONGO_REPLICA_SET_KEY is empty" && exit 1; fi
        printf "%s\n" "$$MONGO_REPLICA_SET_KEY" > /keyfile/mongo-keyfile
        chown 999:999 /keyfile/mongo-keyfile
        chmod 400 /keyfile/mongo-keyfile
        echo "keyfile ready"

  mongodb:
    image: mongo:7
    profiles: ["core","legacy","nest","ai"]
    security_opt:
      - no-new-privileges:true
    command: ["mongod","--replSet","rs0","--bind_ip_all","--keyFile","/etc/mongo-keyfile/mongo-keyfile"]
    environment:
      MONGO_INITDB_DATABASE: cop
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:-cop}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-cop_dev_password_change_me}
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
      - mongodb_keyfile:/etc/mongo-keyfile:ro
    depends_on:
      mongodb-keyfile:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "mongosh \"mongodb://$$MONGO_INITDB_ROOT_USERNAME:$$MONGO_INITDB_ROOT_PASSWORD@localhost:27017/admin?authSource=admin\" --quiet --eval \"try { quit(rs.status().ok ? 0 : 1) } catch(e) { quit(1) }\""]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 20s

  mongodb-init:
    image: mongo:7
    profiles: ["core","legacy","nest","ai"]
    depends_on:
      mongodb:
        condition: service_started
    entrypoint:
      - bash
      - -lc
      - >
        for i in {1..60}; do
          mongosh "mongodb://${MONGO_ROOT_USERNAME:-cop}:${MONGO_ROOT_PASSWORD:-cop_dev_password_change_me}@mongodb:27017/admin?authSource=admin" --quiet --eval "try { rs.status().ok } catch(e) { rs.initiate({_id:'rs0', members:[{_id:0, host:'mongodb:27017'}]}); }" && exit 0;
          sleep 1;
        done;
        echo "Mongo replica set init failed" && exit 1;

  redis:
    image: redis:7-alpine
    profiles: ["core","legacy","nest","ai"]
    security_opt:
      - no-new-privileges:true
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 5s

  # Stub Image→3D compatible with nest Ortho3dService (instant demo GLB download).
  # Producción: sustituir por Meshy/Tripo/Replicate y apuntar ORTHO_IMAGE_TO_3D_* al proveedor real.
  image-to-3d:
    build:
      context: ./services/image-to-3d-stub
    profiles: ["core", "nest", "ai"]
    security_opt:
      - no-new-privileges:true
    ports:
      - "8010:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s

  # Production-ready Image→Depth→3D (MiDaS) service: async jobs + PLY/OBJ/STL export.
  image-to-3d-depth:
    build:
      context: ./services/image-to-3d-depth
      dockerfile: Dockerfile
    profiles: ["ai"]
    security_opt:
      - no-new-privileges:true
    environment:
      IMG3D_REDIS_URL: redis://redis:6379/0
      IMG3D_CELERY_BROKER_URL: redis://redis:6379/1
      IMG3D_CELERY_RESULT_BACKEND: redis://redis:6379/2
      IMG3D_STORAGE_MODE: local
      IMG3D_LOCAL_STORAGE_DIR: /data/models
      IMG3D_DEPTH_MODEL: ${IMG3D_DEPTH_MODEL:-DPT_Large}
      IMG3D_DEVICE: ${IMG3D_DEVICE:-auto}
      IMG3D_OUT_FORMAT: ${IMG3D_OUT_FORMAT:-ply}
      IMG3D_MAKE_MESH_DEFAULT: ${IMG3D_MAKE_MESH_DEFAULT:-false}
    volumes:
      - image_to_3d_depth_data:/data/models
      - image_to_3d_depth_cache:/models
    ports:
      - "8011:8000"
    depends_on:
      redis:
        condition: service_healthy

  image-to-3d-depth-worker:
    build:
      context: ./services/image-to-3d-depth
      dockerfile: worker.Dockerfile
    profiles: ["ai"]
    security_opt:
      - no-new-privileges:true
    environment:
      IMG3D_REDIS_URL: redis://redis:6379/0
      IMG3D_CELERY_BROKER_URL: redis://redis:6379/1
      IMG3D_CELERY_RESULT_BACKEND: redis://redis:6379/2
      IMG3D_STORAGE_MODE: local
      IMG3D_LOCAL_STORAGE_DIR: /data/models
      IMG3D_DEPTH_MODEL: ${IMG3D_DEPTH_MODEL:-DPT_Large}
      IMG3D_DEVICE: ${IMG3D_DEVICE:-auto}
      IMG3D_OUT_FORMAT: ${IMG3D_OUT_FORMAT:-ply}
      IMG3D_MAKE_MESH_DEFAULT: ${IMG3D_MAKE_MESH_DEFAULT:-false}
    volumes:
      - image_to_3d_depth_data:/data/models
      - image_to_3d_depth_cache:/models
    depends_on:
      redis:
        condition: service_healthy

  # CBCT DICOM (ZIP) → GLB (basic segmentation + marching cubes).
  dicom-to-glb:
    build:
      context: ./services/dicom-to-glb
    profiles: ["core", "nest", "ai"]
    security_opt:
      - no-new-privileges:true
    environment:
      # Umbral HU aproximado para hueso/diente; ajuste según escáner (vía .env).
      DICOM_TO_GLB_THRESHOLD: ${DICOM_TO_GLB_THRESHOLD:-350}
    ports:
      - "8020:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 10s

  nest-backend:
    build:
      context: ./nest-migration
      dockerfile: Dockerfile
    profiles: ["core","nest"]
    security_opt:
      - no-new-privileges:true
    volumes:
      # GLB descargados del stub/proveedor; sin volumen el archivo puede perderse al recrear el contenedor.
      - ortho_3d_data:/app/uploads/ortho-3d
    environment:
      PORT: 8080
      MONGODB_URL: mongodb://${MONGO_ROOT_USERNAME:-cop}:${MONGO_ROOT_PASSWORD:-cop_dev_password_change_me}@mongodb:27017/cop?authSource=admin&replicaSet=rs0&retryWrites=true
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-change_me}
      # Mayor TTL en dev reduce tormentas de refresh paralelas; producción puede acortarlo vía .env.
      JWT_ACCESS_EXPIRES: ${JWT_ACCESS_EXPIRES:-45m}
      # Único admin bootstrap (SUPER_ADMIN + ADMIN). Sobrescribe con .env si hace falta.
      APP_BOOTSTRAP_ADMIN_USERNAME: ${APP_BOOTSTRAP_ADMIN_USERNAME:-nelsonh09}
      APP_BOOTSTRAP_ADMIN_PASSWORD: ${APP_BOOTSTRAP_ADMIN_PASSWORD:-NelsonH09092001}
      APP_BOOTSTRAP_ADMIN_EMAIL: ${APP_BOOTSTRAP_ADMIN_EMAIL:-nelsondavid1954@gmail.com}
      APP_BOOTSTRAP_ADMIN_ORG_ID: ${APP_BOOTSTRAP_ADMIN_ORG_ID:-be7f4015-67ad-472b-9cf7-aadcd8b0d604}
      APP_BOOTSTRAP_ADMIN_RESET: ${APP_BOOTSTRAP_ADMIN_RESET:-true}
      APP_BOOTSTRAP_ENFORCE_SOLE_ADMIN: ${APP_BOOTSTRAP_ENFORCE_SOLE_ADMIN:-true}
      ORTHO_AI_URL: http://ortho-ai:8000
      # External Image→3D provider (job/polling).
      # Defaults are safe “placeholders”; override via environment when deploying.
      ORTHO_IMAGE_TO_3D_BASE_URL: ${ORTHO_IMAGE_TO_3D_BASE_URL:-http://image-to-3d:8000}
      # En dev, el contenedor `image-to-3d` es un stub que devuelve un modelo demo (pato).
      # Por defecto lo desactivamos para evitar confusión: para fotos→3D real, configura un proveedor externo.
      ORTHO_IMAGE_TO_3D_ALLOW_STUB_DEMO: ${ORTHO_IMAGE_TO_3D_ALLOW_STUB_DEMO:-false}
      ORTHO_IMAGE_TO_3D_CREATE_PATH: ${ORTHO_IMAGE_TO_3D_CREATE_PATH:-/openapi/v1/image-to-3d}
      ORTHO_IMAGE_TO_3D_POLL_PATH_TEMPLATE: ${ORTHO_IMAGE_TO_3D_POLL_PATH_TEMPLATE:-/openapi/v1/image-to-3d/{id}}
      ORTHO_IMAGE_TO_3D_INPUT_IMAGE_FIELD: ${ORTHO_IMAGE_TO_3D_INPUT_IMAGE_FIELD:-image_url}
      ORTHO_IMAGE_TO_3D_INPUT_IMAGES_FIELD: ${ORTHO_IMAGE_TO_3D_INPUT_IMAGES_FIELD:-images}
      ORTHO_IMAGE_TO_3D_API_KEY: ${ORTHO_IMAGE_TO_3D_API_KEY:-}
      ORTHO_IMAGE_TO_3D_API_KEY_HEADER: ${ORTHO_IMAGE_TO_3D_API_KEY_HEADER:-Authorization}
      ORTHO_IMAGE_TO_3D_API_KEY_PREFIX: ${ORTHO_IMAGE_TO_3D_API_KEY_PREFIX:-Bearer }
      ORTHO_IMAGE_TO_3D_POLL_METHOD: ${ORTHO_IMAGE_TO_3D_POLL_METHOD:-GET}
      # External DICOM→3D provider (CBCT ZIP → GLB).
      ORTHO_DICOM_TO_3D_BASE_URL: ${ORTHO_DICOM_TO_3D_BASE_URL:-http://dicom-to-glb:8000}
      ORTHO_DICOM_TO_3D_CREATE_PATH: ${ORTHO_DICOM_TO_3D_CREATE_PATH:-/openapi/v1/dicom-to-3d}
      ORTHO_DICOM_TO_3D_POLL_PATH_TEMPLATE: ${ORTHO_DICOM_TO_3D_POLL_PATH_TEMPLATE:-/openapi/v1/dicom-to-3d/{id}}
      ORTHO_DICOM_TO_3D_API_KEY: ${ORTHO_DICOM_TO_3D_API_KEY:-}
      ORTHO_DICOM_TO_3D_API_KEY_HEADER: ${ORTHO_DICOM_TO_3D_API_KEY_HEADER:-Authorization}
      ORTHO_DICOM_TO_3D_API_KEY_PREFIX: ${ORTHO_DICOM_TO_3D_API_KEY_PREFIX:-Bearer }
      ORTHO_DICOM_TO_3D_POLL_METHOD: ${ORTHO_DICOM_TO_3D_POLL_METHOD:-GET}
      # Local storage for downloaded GLB files.
      ORTHO_3D_STORAGE_DIR: ${ORTHO_3D_STORAGE_DIR:-/app/uploads/ortho-3d}
      # If set, returned glbUrl will use this base. Otherwise it uses request host/protocol.
      ORTHO_3D_PUBLIC_BASE_URL: ${ORTHO_3D_PUBLIC_BASE_URL:-}
      ORTHO_3D_DOWNLOAD_RESULTS: ${ORTHO_3D_DOWNLOAD_RESULTS:-true}
      # Tamaño máximo por archivo multipart (MB); alinear con client_max_body_size del gateway.
      ORTHO_MULTIPART_MAX_FILE_MB: ${ORTHO_MULTIPART_MAX_FILE_MB:-500}
      # Notificaciones al confirmar reserva (Gmail SMTP + WhatsApp via Twilio). Opcional en dev.
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_WHATSAPP_FROM: ${TWILIO_WHATSAPP_FROM:-}
      # URL base que ven navegadores / Wompi (sin barra final). Dev: gateway en el host.
      PUBLIC_API_ORIGIN: ${PUBLIC_API_ORIGIN:-http://localhost:8080}
      # Orígenes permitidos CORS (coma). Vacío = Nest acepta cualquier origen (solo recomendable en dev).
      CORS_ORIGINS: ${CORS_ORIGINS:-}
    depends_on:
      mongodb:
        condition: service_healthy
      mongodb-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      image-to-3d:
        condition: service_healthy
      dicom-to-glb:
        condition: service_healthy
      ortho-ai:
        condition: service_healthy

  gateway:
    build:
      context: ./services/gateway
    profiles: ["core"]
    ports:
      - "8080:8080"
    depends_on:
      nest-backend:
        condition: service_healthy
      j48-service:
        condition: service_healthy

  j48-service:
    build:
      context: ./services/j48-service
    profiles: ["core"]
    security_opt:
      - no-new-privileges:true
    user: "0:0"
    environment:
      SERVER_PORT: 8080
      J48_ARFF_PATH: /data/relapse_risk_j48.arff
      J48_MODEL_PATH: /models/j48.model
      J48_AUTO_TRAIN: ${J48_AUTO_TRAIN:-true}
    volumes:
      - ./datasets/relapse_risk_j48.arff:/data/relapse_risk_j48.arff:ro
      - j48_models:/models

  ortho-ai:
    build:
      context: ./ortho_system
      dockerfile: Dockerfile
    # Incluido en core para que el fallback /reconstruct del pipeline 3D funcione sin --profile ai.
    profiles: ["core", "nest", "ai"]
    security_opt:
      - no-new-privileges:true
    ports:
      - "8001:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/')"]
      interval: 10s
      timeout: 5s
      retries: 3
    depends_on:
      mongodb:
        condition: service_healthy

  ai-diagnosis-service:
    build:
      context: ./services/ai-diagnosis-service
    profiles: ["ai"]
    environment:
      DIAG_MONGODB_URI: mongodb://${MONGO_ROOT_USERNAME:-cop}:${MONGO_ROOT_PASSWORD:-cop_dev_password_change_me}@mongodb:27017/cop?authSource=admin
      DIAG_MONGODB_DB: cop
      DIAG_REDIS_HOST: redis
      DIAG_REDIS_PORT: 6379
      DIAG_MODEL_DEVICE: cpu
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - models_data:/app/app/ml/weights

  emotion-analysis-service:
    build:
      context: ./services/emotion-analysis-service
    profiles: ["ai"]
    environment:
      EMOTION_MONGODB_URI: mongodb://${MONGO_ROOT_USERNAME:-cop}:${MONGO_ROOT_PASSWORD:-cop_dev_password_change_me}@mongodb:27017/cop?authSource=admin
      EMOTION_MONGODB_DB: cop
      EMOTION_REDIS_HOST: redis
      EMOTION_REDIS_PORT: 6379
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - models_data:/app/app/ml/weights

  recommendation-engine:
    build:
      context: ./services/recommendation-engine
    profiles: ["ai"]
    environment:
      RECO_MONGODB_URI: mongodb://${MONGO_ROOT_USERNAME:-cop}:${MONGO_ROOT_PASSWORD:-cop_dev_password_change_me}@mongodb:27017/cop?authSource=admin
      RECO_MONGODB_DB: cop
      RECO_REDIS_HOST: redis
      RECO_REDIS_PORT: 6379
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - models_data:/app/app/ml/weights

  dashboard:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
      args:
        API_BASE_URL: ${API_BASE_URL:-http://localhost:8080}
    profiles: ["core"]
    ports:
      - "5173:80"
    depends_on:
      gateway:
        condition: service_healthy

  publicweb:
    build:
      context: ./PublicWeb
      args:
        API_BASE_URL: ${PUBLICWEB_API_BASE_URL:-http://localhost:8080}
        DASHBOARD_URL: ${DASHBOARD_URL:-http://localhost:5173}
    profiles: ["core"]
    ports:
      - "5174:80"
    depends_on:
      gateway:
        condition: service_healthy

volumes:
  mongodb_data:
  models_data:
  mongodb_keyfile:
  ortho_3d_data:
  image_to_3d_depth_data:
  image_to_3d_depth_cache:
  j48_models:

