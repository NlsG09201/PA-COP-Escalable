version: '3.8'

services:
  backend:
    build: .
    ports:
      - "8081:8080"
    environment:
      - MONGODB_URL=mongodb://mongodb:27017/cop_escalable
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=prod_secret_key_change_me
      - PORT=8080
    depends_on:
      - mongodb
      - redis

  mongodb:
    image: mongo:6.0
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  redis:
    image: redis:7.0-alpine
    ports:
      - "6379:6379"

volumes:
  mongo_data:
