worker_processes  1;

events { worker_connections  1024; }

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  # Fotos intraorales + multipart + ZIP DICOM CBCT (suelen superar 50 MB).
  client_max_body_size 500m;

  # Avoid Nginx buffering long responses by default (safe for APIs).
  proxy_buffering off;

  # Descarga de GLB / jobs lentos detrás del gateway.
  proxy_connect_timeout 300s;
  proxy_send_timeout 300s;
  proxy_read_timeout 300s;

  server {
    listen 8080;

    # Deep health: proxies Nest (Mongo + Redis checks). Use /health/live on Nest for liveness only.
    location = /health {
      proxy_pass http://nest-backend:8080/health;
      proxy_set_header Host $host;
      access_log off;
    }

    # Nest API (covers /api/** and /public/**)
    location /api/ {
      proxy_pass http://nest-backend:8080;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /public/ {
      proxy_pass http://nest-backend:8080;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Ortho AI service (image pipeline)
    location /ortho-ai/ {
      proxy_pass http://ortho-ai:8000/;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # J48 Python (scikit-learn)
    location /j48/ {
      proxy_pass http://j48-python:8080/;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /ai/diagnosis/ {
      proxy_pass http://ai-diagnosis-service:8090/;
      proxy_set_header Host $host;
    }

    location /ai/emotion/ {
      proxy_pass http://emotion-analysis-service:8091/;
      proxy_set_header Host $host;
    }

    location /ai/relapse/ {
      proxy_pass http://recommendation-engine:8092/;
      proxy_set_header Host $host;
    }

    # Default: return 404 (frontend is served on :5173 and :5174)
    location / {
      return 404;
    }
  }
}

