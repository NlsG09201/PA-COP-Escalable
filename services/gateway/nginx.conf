worker_processes  1;

events { worker_connections  1024; }

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  # Avoid Nginx buffering long responses by default (safe for APIs).
  proxy_buffering off;

  server {
    listen 8080;

    # Basic health endpoint for smoke checks
    location = /health {
      add_header Content-Type text/plain;
      return 200 'ok';
    }

    # Nest API (covers /api/** and /public/**)
    location /api/ {
      proxy_pass http://nest-backend:8080;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /public/ {
      proxy_pass http://nest-backend:8080;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Ortho AI service (image pipeline)
    location /ortho-ai/ {
      proxy_pass http://ortho-ai:8000/;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # J48 service
    location /j48/ {
      # Strip /j48/ prefix when forwarding to the service
      proxy_pass http://j48-service:8080/;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Default: return 404 (frontend is served on :5173 and :5174)
    location / {
      return 404;
    }
  }
}

