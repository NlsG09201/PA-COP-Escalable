name: CI

on:
  push:
    branches: [main, production-readiness, 'release/**']
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  nest-backend:
    name: Nest API build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nest-migration
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: nest-migration/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Production env guard (smoke)
        run: node -e "process.env.NODE_ENV='production';process.env.JWT_SECRET='x';process.env.CORS_ORIGINS='https://a.com';process.env.MONGODB_URL='mongodb://localhost';process.env.REDIS_URL='redis://localhost';require('./dist/config/env.validation').assertProductionEnv();console.log('ok')"
        env:
          NODE_ENV: production
      - name: Mongo placeholder + MONGODB_PASSWORD resolves
        run: |
          node -e "
          process.env.MONGODB_URL='mongodb+srv://u:<db_password>@cluster.example.net/cop?retryWrites=true';
          process.env.MONGODB_PASSWORD='p@ss';
          const v=require('./dist/config/env.validation');
          v.applyResolvedMongoUrlFromEnv();
          if(!process.env.MONGODB_URL.includes('p%40ss')) throw new Error('resolve failed');
          process.env.NODE_ENV='production';
          process.env.JWT_SECRET='x';
          process.env.CORS_ORIGINS='https://a.com';
          process.env.REDIS_URL='redis://localhost';
          v.assertProductionEnv();
          console.log('ok');
          "

  frontend:
    name: Dashboard build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: Frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  publicweb:
    name: PublicWeb build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: PublicWeb
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: PublicWeb/package-lock.json
      - run: npm ci
      - run: npm run build

  spring-api:
    name: Spring Boot API tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend-spring
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mvn --batch-mode verify

  j48-python:
    name: J48 Python train smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r services/j48-python/requirements.txt
      - run: python services/j48-python/train/train_from_arff.py
        env:
          J48_ARFF_PATH: datasets/relapse_risk_j48.arff
          J48_MODEL_PATH: /tmp/j48_test.joblib
