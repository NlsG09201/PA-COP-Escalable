# Espejo de render.yaml en la raíz — usar uno u otro como Blueprint en Render.
# Ver comentarios en ../render.yaml

services:
  - type: web
    name: cop-j48-python
    runtime: docker
    dockerfilePath: ./deploy/docker/j48-python.Dockerfile
    dockerContext: .
    plan: starter
    healthCheckPath: /health

  - type: web
    name: cop-nest-api
    runtime: docker
    dockerfilePath: ./nest-migration/Dockerfile
    dockerContext: ./nest-migration
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_ACCESS_EXPIRES
        value: 45m
      - key: J48_URL
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: SEED_COLOMBIA_SITES
        value: "true"
      - key: PUBLIC_API_ORIGIN
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: DASHBOARD_URL
        sync: false
      - key: PUBLIC_SITE_URL
        sync: false
      - key: APP_BOOTSTRAP_ADMIN_USERNAME
        sync: false
      - key: APP_BOOTSTRAP_ADMIN_PASSWORD
        sync: false
      - key: APP_BOOTSTRAP_ADMIN_EMAIL
        sync: false
      - key: APP_BOOTSTRAP_ADMIN_ORG_ID
        sync: false
      - key: WOMPI_PUBLIC_KEY
        sync: false
      - key: WOMPI_PRIVATE_KEY
        sync: false
      - key: WOMPI_INTEGRITY_SECRET
        sync: false
      - key: WOMPI_EVENTS_SECRET
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_MODE
        value: sandbox
      - key: AI_DIAGNOSIS_URL
        sync: false
      - key: AI_EMOTION_URL
        sync: false
      - key: AI_RELAPSE_URL
        sync: false

  - type: web
    name: cop-web-public
    runtime: node
    rootDir: web-public
    plan: starter
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    envVars:
      - key: NEXT_PUBLIC_API_URL
        sync: false

  - type: web
    name: cop-web-dashboard
    runtime: node
    rootDir: web-dashboard
    plan: starter
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    envVars:
      - key: NEXT_PUBLIC_API_URL
        sync: false
