# Render Blueprint (raíz del repo). Copia espejo de deploy/render.yaml.
# Docs: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: cop-nest-api
    runtime: docker
    dockerfilePath: ./nest-migration/Dockerfile
    dockerContext: ./nest-migration
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_ACCESS_EXPIRES
        value: 45m
      - key: J48_URL
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: SEED_COLOMBIA_SITES
        value: "true"
      - key: PUBLIC_API_ORIGIN
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: DASHBOARD_URL
        sync: false
      - key: PUBLIC_SITE_URL
        sync: false
      - key: APP_BOOTSTRAP_ADMIN_USERNAME
        sync: false
      - key: APP_BOOTSTRAP_ADMIN_PASSWORD
        sync: false
      - key: APP_BOOTSTRAP_ADMIN_EMAIL
        sync: false
      - key: WOMPI_PUBLIC_KEY
        sync: false
      - key: WOMPI_INTEGRITY_SECRET
        sync: false
      - key: WOMPI_EVENTS_SECRET
        sync: false

  - type: web
    name: cop-j48-service
    runtime: docker
    dockerfilePath: ./services/j48-service/Dockerfile
    dockerContext: ./services/j48-service
    plan: starter
    healthCheckPath: /health
