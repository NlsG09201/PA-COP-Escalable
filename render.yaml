# Render Blueprint — https://render.com/docs/blueprint-spec
# Desde el dashboard: New → Blueprint → conecta repo → usa este archivo en la raíz.
#
# Antes del primer deploy: crea MongoDB Atlas + Redis (Upstash o Render Redis) y
# ten listas las URLs (no uses placeholders en MONGODB_URL / REDIS_URL).

services:
  # Key Value (Redis). Tras Sync Blueprint, REDIS_URL se inyecta en cop-nest-api.
  # Borra REDIS_URL manual en Environment si aún tiene el placeholder de Upstash.
  - type: keyvalue
    name: cop-redis
    plan: starter
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []

  # --- Motor IA (ensemble RF/XGBoost/J48 + relapse) — URL en AI_RELAPSE_URL del API ---
  - type: web
    name: cop-recommendation-engine
    runtime: docker
    dockerfilePath: ./deploy/docker/recommendation-engine.Dockerfile
    dockerContext: .
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: RECO_MONGODB_URI
        sync: false
      - key: RECO_MONGODB_DB
        value: cop
      - key: RECO_REDIS_URL
        sync: false

  # --- IA J48 (Python FastAPI + scikit-learn) — desplegar primero y copiar URL pública ---
  - type: web
    name: cop-j48-python
    runtime: docker
    dockerfilePath: ./deploy/docker/j48-python.Dockerfile
    dockerContext: .
    plan: starter
    healthCheckPath: /health

  # --- API NestJS ---
  - type: web
    name: cop-nest-api
    runtime: docker
    dockerfilePath: ./nest-migration/Dockerfile
    dockerContext: ./nest-migration
    plan: starter
    healthCheckPath: /health/live
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URL
        sync: false
      # Si MONGODB_URL sigue con <db_password>, define solo esta variable (contraseña Atlas):
      - key: MONGODB_PASSWORD
        sync: false
      # Pegar valor generado con: .\deploy\exportar-cop-production-env-b64.ps1
      - key: COP_PRODUCTION_ENV_B64
        sync: false
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: cop-redis
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_ACCESS_EXPIRES
        value: 45m
      # Base URL del servicio J48 (sin /predict). Ej: https://cop-j48-python.onrender.com
      - key: J48_URL
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: SEED_COLOMBIA_SITES
        value: "true"
      - key: PUBLIC_API_ORIGIN
        value: https://cop-nest-api.onrender.com
      # Incluye tus URLs Vercel si usas despliegue allí, ej. https://pa-cop-escalable-2qx1.vercel.app
      # (o deja solo Render: el API también acepta *.vercel.app con CORS_ALLOW_VERCEL=true)
      - key: CORS_ALLOW_VERCEL
        value: "true"
      - key: CORS_ORIGINS
        value: https://pa-cop-escalable-2qx1.vercel.app,https://cop-web-public.onrender.com,https://cop-web-dashboard.onrender.com
      - key: DASHBOARD_URL
        value: https://cop-web-dashboard.onrender.com
      - key: PUBLIC_SITE_URL
        value: https://cop-web-public.onrender.com
      - key: APP_BOOTSTRAP_ADMIN_USERNAME
        sync: false
      - key: APP_BOOTSTRAP_ADMIN_PASSWORD
        sync: false
      - key: APP_BOOTSTRAP_ADMIN_EMAIL
        sync: false
      - key: APP_BOOTSTRAP_ADMIN_ORG_ID
        sync: false
      - key: WOMPI_PUBLIC_KEY
        sync: false
      - key: WOMPI_PRIVATE_KEY
        sync: false
      - key: WOMPI_INTEGRITY_SECRET
        sync: false
      - key: WOMPI_EVENTS_SECRET
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_MODE
        value: sandbox
      - key: AI_DIAGNOSIS_URL
        sync: false
      - key: AI_EMOTION_URL
        sync: false
      - key: AI_RELAPSE_URL
        sync: false

  # --- Web pública Next.js ---
  - type: web
    name: cop-web-public
    runtime: node
    rootDir: web-public
    plan: starter
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    envVars:
      - key: NEXT_PUBLIC_API_URL
        value: https://cop-nest-api.onrender.com

  # --- Dashboard clínico Next.js ---
  - type: web
    name: cop-web-dashboard
    runtime: node
    rootDir: web-dashboard
    plan: starter
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    envVars:
      - key: NEXT_PUBLIC_API_URL
        value: https://cop-nest-api.onrender.com
